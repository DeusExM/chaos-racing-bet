<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Course humoristique à 6 personnages, 100 % locale et reproductible par seed." />
    <title>Chaos Race</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="head">
        <h1 class="title">Chaos Race</h1>
        <p class="subtitle">
          Course humoristique à 6 personnages — 100 % locale, reproductible par seed.
        </p>
      </header>

      <section class="stage">
        <div id="game" class="game" role="img" aria-label="Zone de jeu (canvas)"></div>
        <!--
          Racine du HUD : le HUD (P011) y installe le classement, le chrono, le bloc seed et les
          réglages, et y replace l'état et le bandeau de checkpoint déclarés ci-dessous. La mini-carte
          qui occupait une bande entière a été retirée par la passe corrective (le HUD masquait la
          course) ; son modèle reste un hook de test et de debug.
        -->
        <div class="hud" data-testid="hud">
          <!--
            Ligne d'état compacte (passe responsive iPhone) : sur petit écran paysage, l'état, le
            segment, le chrono, le son et le commentateur forment **une seule ligne** en haut de la
            colonne de droite, au lieu de plusieurs blocs superposés. Sur les autres formats, ce
            conteneur est en `display: contents` : ses enfants reprennent exactement les cellules de
            la grille du HUD, et la mise en page de bureau reste inchangée.
          -->
          <div class="hud-topline">
            <p id="race-status" class="hud-status" data-testid="race-status">—</p>
          </div>
          <p
            id="checkpoint-banner"
            class="hud-banner"
            data-testid="checkpoint-banner"
            role="status"
            hidden
          ></p>
          <div id="leaderboard" class="hud-panel" data-testid="leaderboard"></div>
          <!--
            Bouton « persos » (micro-correction responsive) : discret, il ouvre les six personnages en
            grand. Son libellé est écrit par `app/`, comme les autres boutons, et il n'est visible
            qu'en petit paysage (la feuille de style le masque ailleurs). Il n'a donc aucun effet sur
            la mise en page de bureau.
          -->
          <button
            id="gallery-button"
            class="hud-seed-gallery"
            type="button"
            data-testid="gallery-button"
          ></button>
        </div>
        <!--
          Les retours d'événement (bonus/malus attachés aux personnages) et les réglages sont créés
          par le rendu à l'exécution, pas déclarés ici : aucun bloc vide ne peut donc apparaître avant
          le démarrage.
        -->
      </section>

      <div class="controls">
        <button id="start-button" type="button" data-testid="start-button"></button>
        <button id="pause-button" type="button" data-testid="pause-button"></button>
        <button id="replay-button" type="button" data-testid="replay-button"></button>
        <!--
          Barre de relecture (passe corrective 2) : elle est remplie par le rendu et reste masquée
          hors pause manuelle. Elle vit sous l'arène, avec les commandes, pour ne jamais recouvrir la
          piste — c'est le même principe que le déplacement du classement dans sa bande réservée.
        -->
        <div id="replay-bar" class="replay" data-testid="replay-bar" hidden></div>
      </div>

      <section id="debug" class="debug" data-testid="debug" hidden></section>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
