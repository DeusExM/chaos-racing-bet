<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Course humoristique à 6 personnages, 100 % locale et reproductible par seed." />
    <title>Chaos Race</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="head">
        <h1 class="title">Chaos Race</h1>
        <p class="subtitle">
          Course humoristique à 6 personnages — 100 % locale, reproductible par seed.
        </p>
        <p class="seed">Seed : <span id="seed-value" data-testid="seed-value">—</span></p>
      </header>

      <section class="stage">
        <div id="game" class="game" role="img" aria-label="Zone de jeu (canvas)"></div>
        <div class="hud">
          <p id="race-status" class="hud-status" data-testid="race-status">—</p>
          <p
            id="checkpoint-banner"
            class="hud-banner"
            data-testid="checkpoint-banner"
            role="status"
            hidden
          ></p>
          <div id="leaderboard" class="hud-panel" data-testid="leaderboard"></div>
        </div>
      </section>

      <div class="controls">
        <button id="start-button" type="button" data-testid="start-button"></button>
        <button id="pause-button" type="button" data-testid="pause-button"></button>
        <button id="replay-button" type="button" data-testid="replay-button"></button>
      </div>

      <section id="debug" class="debug" data-testid="debug" hidden></section>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
